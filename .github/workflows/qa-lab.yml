name: qa-lab

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Academia presente
        run: |
          test -f docs/academia-qa/README.md
          test -f docs/academia-qa/semana-01/README.md
          test -f docs/academia-qa/semana-12/README.md
          test -f docs/academia-qa/diagramas/README.md
          test -f docs/academia-qa/desafios/quartz.md
          find docs/academia-qa -name '*.md' | wc -l | awk '{ if ($1 < 80) exit 1 }'

  qa:
    runs-on: ubuntu-latest
    needs: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Lint web
        working-directory: apps/web
        run: npm ci && npm run lint
      - name: Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Compose
        working-directory: infra
        run: docker compose up -d --build
      - name: Esperar health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:11001/api/health | grep -q '"overall":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          echo "health nao ficou UP"
          exit 1
      - name: Smoke
        run: bash scripts/smoke.sh
      - name: Playwright
        working-directory: apps/web
        run: npm run e2e
        env:
          CI: "true"
      - name: Logs se falhar
        if: failure()
        working-directory: infra
        run: docker compose logs --no-color > "$GITHUB_WORKSPACE/compose-logs.txt" || true
      - name: Artefatos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-failure
          path: |
            compose-logs.txt
            apps/web/playwright-report
            apps/web/test-results
      - name: Derrubar stack
        if: always()
        working-directory: infra
        run: docker compose down -v
