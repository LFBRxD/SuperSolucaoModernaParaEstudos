# StudyShop umbrella — defaults educacionais (não produção)
# DNS interno: <fullnameOverride>.<namespace>.svc.cluster.local

mongodb:
  enabled: true
  fullnameOverride: mongodb
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 27017
  persistence:
    enabled: false

kafka:
  enabled: true
  fullnameOverride: kafka
  image:
    repository: apache/kafka
    tag: "3.9.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9092
  env:
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
    KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

orders-service:
  enabled: true
  fullnameOverride: orders-service
  replicaCount: 1
  image:
    repository: studyshop/orders-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 11002
    grpcPort: 11003
  env:
    MONGODB_URI: "mongodb://mongodb:27017/orders"
    KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    OTEL_SERVICE_NAME: "orders-service"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    OTEL_METRICS_EXPORTER: "none"
    OTEL_LOGS_EXPORTER: "none"

