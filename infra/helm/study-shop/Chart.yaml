apiVersion: v2
name: study-shop
description: Umbrella chart educacional do StudyShop QA Lab
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: mongodb
    version: 1.0.0
    repository: "file://./charts/mongodb"
    condition: mongodb.enabled
  - name: kafka
    version: 1.0.0
    repository: "file://./charts/kafka"
    condition: kafka.enabled
  - name: orders-service
    version: 1.0.0
    repository: "file://./charts/orders-service"
    condition: orders-service.enabled
  - name: inventory-service
    version: 1.0.0
    repository: "file://./charts/inventory-service"
    condition: inventory-service.enabled
  - name: payments-service
    version: 1.0.0
    repository: "file://./charts/payments-service"
    condition: payments-service.enabled
  - name: notifications-service
    version: 1.0.0
    repository: "file://./charts/notifications-service"
    condition: notifications-service.enabled
  - name: api-gateway
    version: 1.0.0
    repository: "file://./charts/api-gateway"
    condition: api-gateway.enabled
  - name: web
    version: 1.0.0
    repository: "file://./charts/web"
    condition: web.enabled
