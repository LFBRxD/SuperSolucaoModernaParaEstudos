global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:10001"]
  - job_name: orders-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orders-service:10002"]
  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:10004"]
  - job_name: payments-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payments-service:10006"]
  - job_name: notifications-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notifications-service:10007"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
