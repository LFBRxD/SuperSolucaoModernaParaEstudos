services:
  mongodb:
    image: mongo:7
    ports:
      - "11008:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    # Imagem oficial Apache (KRaft). Listeners: use "://:porta" (não 0.0.0.0).
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      # host → EXTERNAL; apps na rede Docker usam kafka:9092 (INTERNAL)
      - "11009:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:11009
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "11016:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: studyshop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    depends_on:
      kafka:
        condition: service_healthy

  orders-service:
    build:
      context: ..
      dockerfile: apps/orders-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_SERVICE_NAME: orders-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "11002:11002"
      - "11003:11003"

  inventory-service:
    build:
      context: ..
      dockerfile: apps/inventory-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "11004:11004"
      - "11005:11005"

  payments-service:
    build:
      context: ..
      dockerfile: apps/payments-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_SERVICE_NAME: payments-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "11006:11006"

  notifications-service:
    build:
      context: ..
      dockerfile: apps/notifications-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_SERVICE_NAME: notifications-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "11007:11007"

  api-gateway:
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    environment:
      ORDERS_GRPC_ADDRESS: static://orders-service:11003
      INVENTORY_GRPC_ADDRESS: static://inventory-service:11005
      NOTIFICATIONS_BASE_URL: http://notifications-service:11007
      ORDERS_HEALTH_URL: http://orders-service:11002/actuator/health
      INVENTORY_HEALTH_URL: http://inventory-service:11004/actuator/health
      PAYMENTS_HEALTH_URL: http://payments-service:11006/actuator/health
      NOTIFICATIONS_HEALTH_URL: http://notifications-service:11007/actuator/health
      STUDYSHOP_AUTH_MODE: local
      JWT_SECRET: studyshop-lab-jwt-secret-change-me-32chars-min
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      - orders-service
      - inventory-service
      - payments-service
      - notifications-service
    ports:
      - "11001:11001"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api-gateway
    ports:
      - "11000:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "11013:4317"
      - "11014:4318"
    depends_on:
      - jaeger
      - prometheus

  jaeger:
    # Jaeger v2 (v1 all-in-one está em EOL desde 2025-12-31)
    image: jaegertracing/jaeger:2.17.0
    environment:
      # Necessário para receber OTLP de outros containers (padrão v2 é localhost)
      JAEGER_LISTEN_HOST: "0.0.0.0"
    ports:
      - "11011:16686"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "11012:9090"

  grafana:
    image: grafana/grafana:11.5.10
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "11010:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  mongo_data:
  grafana_data:
