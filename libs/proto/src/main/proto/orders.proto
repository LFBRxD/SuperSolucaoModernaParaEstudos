syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.studyshop.proto.orders";
option java_outer_classname = "OrdersProto";

package studyshop.orders;

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder (GetOrderRequest) returns (OrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
}

message OrderItemInput {
  string product_id = 1;
  int32 quantity = 2;
  string product_name = 3;
  double unit_price = 4;
}

message CreateOrderRequest {
  repeated OrderItemInput items = 1;
  bool force_payment_failure = 2;
  string customer_email = 3;
}

message GetOrderRequest {
  string order_id = 1;
}

message ListOrdersRequest {
  string status = 1;
}

message OrderItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
}

message OrderResponse {
  string order_id = 1;
  string status = 2;
  double total = 3;
  string customer_email = 4;
  bool force_payment_failure = 5;
  string created_at = 6;
  string updated_at = 7;
  repeated OrderItem items = 8;
  string status_reason = 9;
}

message ListOrdersResponse {
  repeated OrderResponse orders = 1;
}
